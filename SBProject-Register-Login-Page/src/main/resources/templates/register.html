<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Register Page</title>
</head>
<body>
	<h2>Register Here :</h2>

	<div th:if="${successMsg}">
		<h3 style="color: green;" th:text="${successMsg}"></h3>
	</div>

	<div th:if="${errorMsg}">
		<h3 style="color: red;" th:text="${errorMsg}"></h3>
	</div>

	<form th:action="@{/registerForm}" th:object="${user}" method="post">
		Name : <input type="text" th:field="*{name}"><br /> Email : <input
			type="text" th:field="*{email}"><br /> Password : <input
			type="password" th:field="*{password}"><br /> Phone No : <input
			type="text" th:field="*{phoneno}"><br /> <input
			type="submit" value="Register">

	</form>

	<a href="index.html">Home</a>
	<br />
	<br />
	<a href="loginPage">Login</a>

</body>
</html>
