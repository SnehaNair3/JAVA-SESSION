<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login Page</title>
</head>
<body>

	<h2>Login Here !!</h2>

	<div th:if="${errorMsg}">
		<h3 style="color: red;" th:text="${errorMsg}"></h3>
	</div>

	<form th:action="@{/loginForm}" th:object="${user}" method="post">
		Email : <input type="text" th:field="*{email}"> Password : <input
			type="password" th:field="*{password}"> <input type="submit"
			value="Login">
	</form>

	<br />
	<br />

	<a href="registerPage">Register</a>
</body>
</html>
